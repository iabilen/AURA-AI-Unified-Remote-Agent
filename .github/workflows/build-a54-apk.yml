name: Verify AURA Android
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - aura/pre-device-hardening-plan
    paths:
      - 'ultra-native/**'
      - '.github/workflows/build-a54-apk.yml'
concurrency:
  group: aura-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Android unit tests
        working-directory: ultra-native
        run: bash ./gradlew :app:testDebugUnitTest --tests com.agent.ultra.AgentBackgroundServiceManifestTest --tests com.agent.ultra.NotificationLogPrivacyTest --tests com.agent.ultra.OpenAiClientResponseTest --no-daemon

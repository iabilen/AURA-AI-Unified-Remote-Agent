name: Build AURA Relay

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/build-aura-relay.yml'
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/build-aura-relay.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Relay smoke test
        run: node smoke-test.mjs
